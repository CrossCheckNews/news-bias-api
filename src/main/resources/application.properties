spring.application.name=news-bias-api

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:newsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Gemini AI
# \uC81C\uCD9C\uC6A9 \uB370\uBAA8\uC5D0\uC11C\uB294 \uC678\uBD80 AI \uD638\uCD9C\uC744 \uD544\uC218\uB85C \uC0AC\uC6A9\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
# \uC2E4\uC81C \uD638\uCD9C\uC774 \uD544\uC694\uD55C \uACBD\uC6B0 \uD658\uACBD \uBCC0\uC218 \uB610\uB294 \uB85C\uCEEC \uC124\uC815\uC73C\uB85C \uAC12\uC744 \uC8FC\uC785\uD569\uB2C8\uB2E4.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash

# Ollama
# \uB85C\uCEEC Ollama \uC0AC\uC6A9 \uC2DC \uC544\uB798 \uD658\uACBD \uBCC0\uC218\uB85C \uC124\uC815\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.
# \uB370\uBAA8 \uC2E4\uD589\uC740 \uC800\uC7A5\uB41C \uC2DC\uC5F0\uC6A9 \uC694\uC57D \uB370\uC774\uD130\uB97C \uAE30\uC900\uC73C\uB85C \uD655\uC778\uD569\uB2C8\uB2E4.
ollama.base.url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2}
ollama.api.key=${OLLAMA_API_KEY:}

# Admin credentials
admin.username=admin
admin.password=admin1234

# JWT
jwt.secret=you r-32-bytes-or-longer-secret-key
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# RSS Fixture (true: \uD30C\uC77C\uC5D0\uC11C \uC77D\uC74C, false: \uC2E4\uC2DC\uAC04 \uB124\uD2B8\uC6CC\uD06C \uC218\uC9D1)
rss.use-fixture=false
rss.fixture-path=rss-fixtures

demo.data.path=src/main/resources/demo-data

# Topic Clustering (TF-IDF + Cosine Similarity)
# TF-IDF cosine\uC740 dense embedding\uBCF4\uB2E4 \uAC12\uC774 \uB0AE\uC74C (0.1~0.4 \uBC94\uC704\uAC00 \uC77C\uBC18\uC801)
clustering.similarity-threshold=0.3
clustering.min-publishers=2