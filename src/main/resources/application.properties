rss.fixture-path=rss-fixtures

demo.data.path=src/main/resources/demo-data

# Topic Clustering (TF-IDF + Cosine Similarity)
# TF-IDF cosine\uC740 dense embedding\uBCF4\uB2E4 \uAC12\uC774 \uB0AE\uC74C (0.1~0.4 \uBC94\uC704\uAC00 \uC77C\uBC18\uC801)
clustering.similarity-threshold=0.3
clustering.min-publishers=2