spring.application.name=news-bias-api

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:newsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Gemini AI (키 없으면 Ollama로 폴백)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash

# Ollama (Gemini 폴백 / GEMINI_API_KEY 미설정 시 기본 사용)
ollama.base.url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2}

# Admin credentials
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# RSS Fixture (true: 파일에서 읽음, false: 실시간 네트워크 수집)
rss.use-fixture=true
rss.fixture-path=rss-fixtures

# Topic Clustering (TF-IDF + Cosine Similarity)
# TF-IDF cosine은 dense embedding보다 값이 낮음 (0.1~0.4 범위가 일반적)
clustering.similarity-threshold=0.15
clustering.min-publishers=2