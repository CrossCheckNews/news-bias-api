version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: crosschecknews-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: crosschecknews_dev
      MYSQL_USER: crosscheck
      MYSQL_PASSWORD: crosscheck1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: